# Despliegue en Render (plan gratuito) con la base en Supabase. Pasos en README.md → "Probarlo en línea".
services:
  - type: web
    name: asistencia-vial
    runtime: node
    plan: free
    branch: claude/roadside-assistance-app-ch0lrd
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase → Project Settings → Database → Connection string → "Session pooler" (URI).
      - key: DATABASE_URL
        sync: false
      # Secreto que usa supabase/motor.sql para llamar a /api/tick cada 10 s.
      - key: TICK_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: PBX_PASSWORD
        value: pbx123
      - key: NOMINATIM_USER_AGENT
        value: asistencia-vial-demo/0.1
      # Rutas con tráfico en vivo (opcional). Sin él se usa OSRM gratis por calles.
      # Pega aquí el mismo token pk... que usabas en el prototipo (Supabase/GitHub).
      # También pinta las teselas del mapa (Mapbox Light) vía next.config.ts.
      - key: MAPBOX_TOKEN
        sync: false
      # Teléfono de la Central para "Soporte" (llamar / WhatsApp) en cliente y piloto.
      - key: NEXT_PUBLIC_CENTRAL_PHONE
        value: 5555-0000
