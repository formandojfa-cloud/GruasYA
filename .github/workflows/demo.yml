name: Pruebas y demo

on:
  push:
    branches: [main, claude/prototipo-mvp]
  pull_request:
  workflow_dispatch: # para volver a probar los secretos sin cambiar código

permissions:
  contents: write

jobs:
  pruebas-y-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Dice qué secretos están configurados, sin mostrar sus valores.
      - name: Revisar secretos
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          MAPBOX: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: |
          for v in URL ANON MAPBOX; do
            if [ -n "${!v}" ]; then echo "$v: configurado"; else echo "$v: FALTA"; fi
          done
          if [ -n "$URL" ]; then
            case "$URL" in */) echo "URL: termina en barra (la app la quita sola)";; esac
            case "$URL" in */rest/v1*) echo "URL: es la dirección REST; la app usa solo el dominio (lo recorta sola)";; esac
            case "$URL" in *" "*) echo "URL: tiene espacios";; esac
            case "$URL" in *supabase.com/dashboard*) echo "URL: es la del panel, no la Project URL de Settings → API";; esac
            # Muestra la forma de la URL con el identificador del proyecto tapado.
            echo "URL (tapada): $(echo "$URL" | sed -E 's#^(https?://)[^./]+#\1xxxx#')"
            URL="$(echo "$URL" | tr -d '[:space:]' | sed -E 's#/+$##; s#/rest/v1$##; s#/+$##')"
            case "$URL" in https://*.supabase.co) echo "URL: forma correcta";; *) echo "URL: forma INCORRECTA (debe ser https://xxxx.supabase.co)";; esac
            case "$ANON" in eyJ*) echo "ANON: forma correcta";; sb_publishable_*) echo "ANON: clave publishable (sirve)";; *) echo "ANON: forma INCORRECTA (debe empezar con eyJ o sb_publishable_)";; esac
            codigo=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ANON" "$URL/rest/v1/" || echo "sin conexión")
            echo "Supabase responde: HTTP $codigo"
          fi
      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # Publica la demo en la rama gh-pages (GitHub Pages sirve esa rama).
      - if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
