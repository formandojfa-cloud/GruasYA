name: Pruebas y demo

on:
  push:
    branches: [main, claude/prototipo-mvp]
  pull_request:

permissions:
  contents: write

jobs:
  pruebas-y-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
      # Publica la demo en la rama gh-pages (GitHub Pages sirve esa rama).
      - if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
